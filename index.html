<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Todo List</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="overlay">

<div class="todo-container">


<!-- Header -->

<div class="header">

<h1>
<i class="fa-solid fa-list-check"></i>
My Todo List
</h1>

<p id="currentDateTime"></p>

</div>



<!-- Input Section -->

<div class="input-section">


<input 
type="text"
id="taskInput"
placeholder="Enter your task...">



<select id="priority">

<option value="High">🔴 High</option>

<option value="Medium" selected>
🟡 Medium
</option>

<option value="Low">
🟢 Low
</option>

</select>



<button onclick="addTask()">

<i class="fa-solid fa-plus"></i>
Add

</button>


</div>




<!-- Search -->

<div class="search-section">

<input 
type="text"
id="searchTask"
placeholder="🔍 Search task..."
onkeyup="searchTask()">

</div>





<!-- Task Statistics -->

<div class="stats-container">


<div class="stat-card">

<h3>Total</h3>

<span id="totalTasks">
0
</span>

</div>



<div class="stat-card">

<h3>Pending</h3>

<span id="pendingTasks">
0
</span>

</div>



<div class="stat-card">

<h3>Completed</h3>

<span id="completedTasks">
0
</span>

</div>



<div class="stat-card">

<h3>Deleted</h3>

<span id="deletedTasks">
0
</span>

</div>


</div>





<!-- Progress -->

<div class="progress-section">


<div class="progress-text">

<span>
Completion Progress
</span>

<span>
<b id="percentage">
0
</b>%
</span>

</div>



<div class="progress-bar">

<div id="progress"></div>

</div>


</div>







<!-- Filters -->


<div class="filter-buttons">


<button onclick="filterTasks('all')">
All
</button>


<button onclick="filterTasks('pending')">
Pending
</button>


<button onclick="filterTasks('completed')">
Completed
</button>


<button onclick="filterTasks('deleted')">
Deleted
</button>


</div>








<!-- Task List -->

<ul id="taskList">

</ul>





<!-- Empty State -->


<div id="emptyState">


<i class="fa-regular fa-face-smile"></i>


<h3>
No Tasks Yet
</h3>


<p>
Add your first task to get started.
</p>


</div>





</div>

</div>





<script src="script.js"></script>


</body>

</html>
